[package]
name = "player-name"
version = "0.1.0"
edition = "2021"

[dependencies]
linera-sdk = "0.14.2"
async-graphql = { version = "7.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "player_name_contract"
path = "src/contract.rs"

[[bin]]
name = "player_name_service"
path = "src/service.rs"