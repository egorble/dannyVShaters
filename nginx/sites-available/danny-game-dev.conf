# Конфігурація nginx для Danny Game (Development)
# HTTP версія без SSL для локальної розробки

server {
    listen 80;
    server_name localhost 127.0.0.1;
    
    # CORS заголовки для SharedArrayBuffer підтримки
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    
    # Основна директорія для статичних файлів
    root /var/www/danny-game;
    index index.html;
    
    # Логування для розробки
    access_log /var/log/nginx/danny-game-dev.access.log;
    error_log /var/log/nginx/danny-game-dev.error.log debug;
    
    # Обробка OPTIONS запитів
    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        
        try_files $uri $uri/ @frontend;
    }
    
    # Проксування до Danny Game Frontend
    location @frontend {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # CORS заголовки
        proxy_set_header Cross-Origin-Opener-Policy "same-origin";
        proxy_set_header Cross-Origin-Embedder-Policy "require-corp";
    }
    
    # GraphQL API для Linera сервісу
    location /graphql {
        proxy_pass http://127.0.0.1:8080/graphql;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймаути для GraphQL запитів
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # CORS для GraphQL
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }
    
    # WebSocket підтримка для GraphQL підписок
    location /graphql/ws {
        proxy_pass http://127.0.0.1:8080/graphql;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket таймаути
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
    
    # Player Name Orchestrator API
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # CORS для API
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }
    
    # Статичні ресурси з кешуванням
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm)$ {
        expires 1h;  # Коротший час кешування для розробки
        add_header Cache-Control "public";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        
        # Спеціальні заголовки для WASM файлів
        location ~* \.wasm$ {
            add_header Content-Type "application/wasm";
            add_header Cross-Origin-Resource-Policy "cross-origin";
        }
    }
    
    # Заборона доступу до системних файлів
    location ~ /\. {
        deny all;
    }
    
    location ~ ~$ {
        deny all;
    }
    
    # Здоров'я сервера
    location /health {
        access_log off;
        return 200 "healthy (development)\n";
        add_header Content-Type text/plain;
    }
    
    # Інформація про розробку
    location /dev-info {
        access_log off;
        return 200 '{"mode":"development","services":{"frontend":"http://localhost:8082","orchestrator":"http://localhost:3001","linera":"http://localhost:8080"}}';
        add_header Content-Type application/json;
    }
}