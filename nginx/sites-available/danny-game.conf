# Конфігурація nginx для Danny Game
# Підтримка HTTP/HTTPS, WebSocket, та інтеграція з Linera

# Перенаправлення HTTP на HTTPS
server {
    listen 80;
    server_name dannyvshaters.xyz www.dannyvshaters.xyz;
    
    # Перенаправлення на HTTPS
    return 301 https://$server_name$request_uri;
}

# Основний HTTPS сервер
server {
    listen 443 ssl http2;
    server_name dannyvshaters.xyz www.dannyvshaters.xyz;
    
    # SSL конфігурація
    ssl_certificate /etc/letsencrypt/live/dannyvshaters.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dannyvshaters.xyz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dannyvshaters.xyz/chain.pem;
    
    # SSL налаштування безпеки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Безпекові заголовки
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # CORS заголовки для SharedArrayBuffer підтримки
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    
    # Основна директорія для статичних файлів
    root /var/www/danny-game;
    index index.html;
    
    # Логування
    access_log /var/log/nginx/danny-game.access.log;
    error_log /var/log/nginx/danny-game.error.log;
    
    # Обробка OPTIONS запитів
    location / {
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        
        try_files $uri $uri/ @frontend;
    }
    
    # Проксування до Danny Game Frontend
    location @frontend {
        proxy_pass http://danny_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # CORS заголовки
        proxy_set_header Cross-Origin-Opener-Policy "same-origin";
        proxy_set_header Cross-Origin-Embedder-Policy "require-corp";
    }
    
    # GraphQL API для Linera сервісу
    location /graphql {
        proxy_pass http://linera_service/graphql;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймаути для GraphQL запитів
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # CORS для GraphQL
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }
    
    # WebSocket підтримка для GraphQL підписок
    location /graphql/ws {
        proxy_pass http://linera_service/graphql;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket таймаути
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
    
    # Player Name Orchestrator API
    location /api/ {
        proxy_pass http://orchestrator/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # CORS для API
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }
    
    # Статичні ресурси з кешуванням
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        
        # Спеціальні заголовки для WASM файлів
        location ~* \.wasm$ {
            add_header Content-Type "application/wasm";
            add_header Cross-Origin-Resource-Policy "cross-origin";
        }
    }
    
    # Заборона доступу до системних файлів
    location ~ /\. {
        deny all;
    }
    
    location ~ ~$ {
        deny all;
    }
    
    # Здоров'я сервера
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}