version: '3.8'

services:
  # Main Danny Game service with Linera
  danny-game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: danny-game-app
    ports:
      - "8080:8080"   # Linera GraphQL service
      - "8082:8082"   # Frontend server
      - "3001:3001"   # Orchestrator API
    environment:
      - LINERA_FAUCET=https://faucet.testnet-babbage.linera.net
      - LINERA_STORAGE=memory
      - RUST_LOG=info
      - NODE_ENV=production
      - FRONTEND_PORT=8082
      - ORCHESTRATOR_PORT=3001
      - LINERA_SERVICE_PORT=8080
      - WALLET_PATH=/app/wallet
    volumes:
      - wallet_data:/app/wallet
      - app_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - danny-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: danny-game-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - danny-game
    restart: unless-stopped
    networks:
      - danny-network

  # Optional: Monitoring with Prometheus (uncomment if needed)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: danny-game-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus_data:/prometheus
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #   networks:
  #     - danny-network

  # Optional: Grafana for monitoring dashboards
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: danny-game-grafana
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin123
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   networks:
  #     - danny-network

volumes:
  wallet_data:
    driver: local
  app_data:
    driver: local
  nginx_logs:
    driver: local
  # prometheus_data:
  #   driver: local
  # grafana_data:
  #   driver: local

networks:
  danny-network:
    driver: bridge